<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec; --card:#fff; --ink:#1d1d1f; --muted:#7a756c; --line:#ece8df; --soft:#faf8f3;
  --accent:#ee6a45; --accent-soft:#fdece6; --dark:#232323;
  --ok:#2f8f4e; --ok-soft:#e7f5ec; --bad:#d64535; --bad-soft:#fdebe8;
  --y:#f8dd7c; --v:#d4c3f7; --b:#c3e4f5; --g:#cbecd3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(244,242,236,.88);backdrop-filter:blur(10px)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--dark);color:var(--y);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.who{display:flex;background:#fff;border-radius:999px;padding:4px}
.who button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--muted);font-size:13.5px}
.who button.on{background:var(--dark);color:#fff}
.btn{white-space:nowrap;border:1px solid #ddd8cc;background:#fff;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:#c9c2b3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.small{padding:6px 14px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--bad)}
@media (max-width:640px){.top{padding:12px 16px}.brand span{display:none}.who{display:none}}

/* ---------- sidebar ---------- */
.hot{position:fixed;left:0;top:68px;bottom:0;width:22px;z-index:15}
.hint{position:fixed;left:9px;top:50%;transform:translateY(-50%);z-index:14;display:flex;flex-direction:column;gap:6px;opacity:.5;transition:opacity .2s;pointer-events:none}
.hint span{display:block;width:14px;height:3px;border-radius:2px;background:var(--muted)}
.side{position:fixed;left:12px;top:80px;bottom:12px;width:300px;z-index:16;background:#fff;border-radius:22px;
  box-shadow:0 12px 40px rgba(40,30,10,.12);transform:translateX(calc(-100% - 20px));transition:transform .25s ease;padding:20px 14px;overflow:auto}
.side.open,.side.pinned{transform:none}
.side h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 8px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
.pin{border:0;background:var(--soft);color:var(--muted);font-size:12px;padding:4px 10px;border-radius:999px;text-transform:none;letter-spacing:0}
.topic{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;cursor:pointer;font-weight:500;line-height:1.35}
.topic:hover{background:var(--soft)}
.topic.on{background:var(--y);font-weight:600}
.topic .n{flex:none;width:24px;height:24px;border-radius:8px;background:rgba(0,0,0,.06);display:grid;place-items:center;font-size:12px}
.subs{margin:6px 0 10px 22px;border-left:2px solid var(--line);padding-left:10px}
.sub{font-size:13.5px;color:var(--muted);padding:6px 10px;border-radius:10px;cursor:pointer;line-height:1.35;display:flex;gap:8px}
.sub:hover{background:var(--soft);color:var(--ink)}
.sub b{font-weight:600;color:var(--ink);opacity:.5}
.add-topic{margin:14px 4px 0;width:calc(100% - 8px)}

/* ---------- page ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:36px clamp(16px,4vw,56px) 140px;transition:padding .25s}
body.pinned .wrap{padding-left:340px;max-width:1620px}
@media (max-width:900px){body.pinned .wrap{padding-left:clamp(16px,4vw,56px)}}
@media (max-width:640px){.wrap{padding:20px 16px 100px}}
.lesson-head{padding:8px 4px 36px}
.kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lesson-head h1{font-size:40px;line-height:1.15;letter-spacing:-.02em;margin:10px 0 20px;font-weight:700;outline:none}
@media (max-width:640px){.lesson-head h1{font-size:30px}}
.lesson-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip-meta{background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500}

/* ---------- sections (collapsible) ---------- */
.sec{background:var(--card);border-radius:26px;margin:0 0 28px;scroll-margin-top:90px;box-shadow:0 1px 2px rgba(40,30,10,.04)}
.sec-head{display:flex;align-items:center;gap:18px;padding:24px 28px;cursor:pointer;user-select:none}
.sec-head:hover .chev{background:var(--soft)}
.num{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:17px}
.num.ico{font-size:27px}
.c0{background:var(--y)}.c1{background:var(--v)}.c2{background:var(--b)}.c3{background:var(--g)}
.sec-title{flex:1;min-width:0}
.sec-title h2{font-size:23px;line-height:1.3;margin:2px 0 0;font-weight:700;outline:none;user-select:text}
.chev{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s ease,background .15s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec-collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease}
.sec.closed .sec-collapse{grid-template-rows:0fr}
.sec-inner{overflow:hidden;min-height:0}
.sec-head{padding:24px clamp(18px,3vw,40px)}
.sec-body{margin:0 clamp(16px,3vw,40px);padding:36px clamp(0px,1.5vw,16px) 48px;border-top:1px solid var(--line)}
@media (max-width:640px){.sec-head{padding:18px;gap:12px}.num{width:42px;height:42px;font-size:15px}.sec-title h2{font-size:19px}.sec-body{margin:0 16px;padding:24px 0 32px}}

/* blocks inside a section */
.blk + .blk{margin-top:48px;padding-top:44px;border-top:1px dashed #e4dfd3}
.blk-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.blk-head h3{font-size:19px;margin:0;font-weight:700;outline:none;flex:1;min-width:120px}
.tag{font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--dark);color:#fff;white-space:nowrap}
.tag.t-gap,.tag.t-mcq,.tag.t-translate,.tag.t-sort{background:var(--accent)}
.instr{color:var(--muted);margin:0 0 22px;outline:none}

/* prose */
.rule-box{outline:none}
.rule-box p{margin:0 0 16px;max-width:90ch}
.rule-box > :last-child{margin-bottom:0}
.rule-box:not(.plain){background:var(--soft);border:1px solid #f0ebde;border-radius:20px;padding:30px 34px}
@media (max-width:640px){.rule-box:not(.plain){padding:22px 20px}}
mark{background:#fdeaa0;padding:1px 4px;border-radius:5px;color:inherit}
s{color:var(--muted)}
.muted{color:var(--muted);font-size:14.5px}

/* tables — own design */
.tbl-wrap{margin:22px 0 26px;border:1px solid var(--line);border-radius:20px;overflow-x:auto;background:#fff}
table.nice{width:100%;border-collapse:collapse;min-width:620px;font-size:15px}
table.nice th{background:var(--soft);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;text-align:left;padding:15px 22px;border-bottom:1px solid var(--line)}
table.nice td{padding:17px 22px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
table.nice tr:last-child td{border-bottom:0}
table.nice tbody tr:hover td{background:#fdfcf9}
.pos{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;margin-top:3px}
.p0{background:#e3effd;color:#1f5fbf}.p1{background:#fbe6f1;color:#a3155f}.p2{background:#e2f4e6;color:#21703a}
.p3{background:#fdf0cc;color:#8f5600}.p4{background:#efe6fd;color:#6f35c0}.p5{background:#ddf3f5;color:#00727a}
.p6{background:#fde4e0;color:#b63a26}.p7{background:#ffecdb;color:#a95600}.p8{background:#eceeef;color:#4a5960}.p9{background:#e6e8f7;color:#3a46a0}

/* formula */
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 24px}
.formula .f{display:flex;flex-direction:column;align-items:center;padding:12px 18px;border-radius:16px;font-size:14px;line-height:1.3;gap:2px}
.formula .f small{font-size:12px;opacity:.75}
.formula .arr{color:var(--muted);font-size:18px}

/* examples — calm sentence rows */
h4.lvl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin:30px 0 14px;padding:5px 14px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.sent{display:flex;flex-wrap:wrap;gap:12px 8px;align-items:flex-start;padding:18px 22px;border-radius:18px;background:var(--soft);margin:0 0 12px;font-size:17px}
.ch{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.ch .w{padding:4px 12px;border-radius:10px;font-weight:500}
.ch .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;background:transparent!important}

/* exercises */
ol.items{list-style:none;margin:0;padding:0;counter-reset:i}
ol.items li{counter-increment:i;position:relative;padding:14px 20px 14px 60px;margin:0 0 10px;background:var(--soft);border-radius:16px;line-height:2}
ol.items li::before{content:counter(i);position:absolute;left:18px;top:16px;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);line-height:1}
.gap-in{border:0;border-bottom:2px solid #d6d0c3;background:transparent;width:120px;padding:0 6px;text-align:center;color:var(--accent);font-weight:600}
.gap-in:focus{outline:none;border-color:var(--accent)}
.gap-in.ok,.tr-in.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.gap-in.bad,.tr-in.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.ru{font-weight:600;line-height:1.5;margin-bottom:10px}
.tr-in.ok,.tr-in.bad{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(0,0,0,.07) 31px,rgba(0,0,0,.07) 32px)}
.tr-in{display:block;width:100%;max-width:900px;min-height:70px;border:1px solid var(--line);border-radius:14px;padding:3px 18px;font:inherit;font-size:16px;font-weight:500;line-height:32px;resize:none;overflow:hidden;color:var(--ink);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#ece6d8 31px,#ece6d8 32px) #fff;background-position:0 3px;background-attachment:local}
.tr-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ans{font-size:14px;color:var(--ok);margin-left:10px;font-weight:600}
.ans.line{display:block;margin:8px 0 0;line-height:1.4}
.ans.line[hidden]{display:none}
.q{font-weight:600;margin-bottom:8px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);border-radius:999px;padding:6px 16px;background:#fff;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt.picked{border-color:var(--dark);background:var(--dark);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt b{margin-right:6px;opacity:.6}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.score{font-size:14px;color:var(--muted);margin-left:auto;font-weight:500}

/* sort exercise */
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:16px;border:1.5px dashed #ddd6c8;border-radius:16px;min-height:58px;background:var(--soft);margin-bottom:14px}
.chip{padding:5px 14px;border-radius:999px;background:#fff;border:1px solid #ddd6c8;cursor:grab;user-select:none;font-weight:500;font-size:14px}
.chip.sel{border-color:var(--dark);background:var(--dark);color:#fff}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chip.shown{border-style:dashed;border-color:var(--ok);color:var(--ok);background:#fff}
.buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bucket{border:1px solid var(--line);border-radius:16px;padding:10px;min-height:96px;cursor:pointer}
.bucket:hover,.bucket.over{border-color:var(--accent)}
.bucket-h{margin-bottom:8px}
.bucket-body{display:flex;flex-wrap:wrap;gap:5px}

/* vocabulary */
.tag.t-vocab{background:#6f35c0}
.vfilter{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.vfilter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500}
.vfilter button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.vfilter button span{opacity:.55;margin-left:4px}
table.vocab td{vertical-align:middle}
table.vocab td.c-pic{width:104px;padding-right:6px}
.credits{margin-top:14px;font-size:12.5px;color:var(--muted)}
.credits summary{cursor:pointer;font-weight:500}
.credits ul{margin:10px 0 0;padding-left:18px;columns:2;column-gap:28px}
.credits li{break-inside:avoid;margin-bottom:4px;line-height:1.4}
.credits a{color:inherit}
@media (max-width:640px){.credits ul{columns:1}}
.pic{width:76px;height:76px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:31px;overflow:hidden;line-height:1}
.pic img{width:100%;height:100%;object-fit:cover}
.word{font-weight:700;font-size:16.5px;line-height:1.3}
.forms{font-size:13px;color:var(--muted);margin-top:2px}
.vex{font-style:italic;color:#57524a}
.vdel{opacity:0;border:0;background:none;color:var(--muted);font-size:14px;padding:4px 8px;border-radius:8px;transition:opacity .15s}
table.vocab tr:hover .vdel{opacity:1}
.vdel:hover{background:var(--bad-soft);color:var(--bad)}
.add-row td{background:var(--soft)!important;padding:14px 18px!important}
.add-word{width:100%;border:1.5px dashed #d6cfbf;background:transparent;border-radius:14px;padding:12px;font-weight:600;color:var(--muted);font-size:15px}
.add-word:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.add-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;align-items:end}
.add-form[hidden]{display:none}
.add-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.add-form input,.add-form select,.vedit select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font:inherit;font-size:14.5px;color:var(--ink)}
.add-form .full{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.add-form .pic{width:44px;height:44px;font-size:24px;border-radius:12px}
.upl{font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline}
.upl input{display:none}

/* notes & writing */
.tag.t-writing{background:var(--accent)}
.tag.t-notes{background:#00727a}
ol.qlist{margin:0 0 18px;padding:0;list-style:none;counter-reset:q;display:grid;gap:8px}
ol.qlist li{counter-increment:q;position:relative;padding:12px 18px 12px 56px;background:#fff;border:1px solid var(--line);border-radius:14px;line-height:1.5}
ol.qlist li::before{content:counter(q);position:absolute;left:16px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1}
.rule-box.plain ol.qlist li{background:var(--soft);border-color:transparent}
textarea.lined{display:block;width:100%;min-height:186px;border:1px solid var(--line);border-radius:18px;padding:10px 24px;font:inherit;font-size:16.5px;line-height:34px;resize:none;overflow:hidden;color:var(--ink);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#ece6d8 33px,#ece6d8 34px) #fff;background-position:0 10px;background-attachment:local}
textarea.lined:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.lined::placeholder{color:#b9b2a4}
.w-task{margin-bottom:22px}
.w-foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.saved{opacity:0;transition:opacity .3s;color:var(--ok)}
.saved.on{opacity:1}

/* video */
.tag.t-video{background:#c5221f}
.video{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 10px 30px rgba(40,30,10,.12)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.empty{display:grid;place-items:center;color:#aaa;font-size:15px}
.video-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.video-meta a{margin-left:auto;color:var(--muted);font-size:14px;text-decoration:none;font-weight:500}
.video-meta a:hover{color:var(--accent)}

/* edit mode */
.edit-row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.edit-row input[type=text]{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:#fff}
.edit-row input.short{flex:0 0 160px}
.edit-hint{font-size:13px;color:var(--muted)}
.mcq-edit{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:14px}
body.editing [contenteditable=true]{background:rgba(238,106,69,.05);box-shadow:inset 0 0 0 1px rgba(238,106,69,.3);border-radius:8px}
body.editing h3[contenteditable]:empty::before{content:'Подзаголовок (можно оставить пустым)';color:#bbb;font-weight:400}
.add-block{margin-top:40px;border:2px dashed var(--line);border-radius:18px;padding:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.add-sec{display:flex;gap:10px;justify-content:center;padding:10px 0}
.edit-only{display:none}
body.editing .edit-only{display:inline-flex;gap:2px}
</style>
</head>
<body>

<header class="top">
  <div class="logo">En</div>
  <div class="brand"><b>English Notebook</b><span>Тетрадь учителя и ученицы</span></div>
  <div class="spacer"></div>
  <div class="who" id="who"><button class="on">Учитель</button><button>Ученица</button></div>
  <button class="btn" id="editBtn">✏️ Редактировать</button>
</header>

<div class="hot" id="hot"></div>
<div class="hint" id="hint"><span></span><span></span><span></span></div>
<nav class="side" id="side">
  <h3>Темы <button class="pin" id="pinBtn">📌 закрепить</button></h3>
  <div id="topics"></div>
  <button class="btn add-topic" id="addTopic">＋ Новая тема</button>
</nav>

<main class="wrap" id="page"></main>

<script>
const VERBPOS=['v','virr','phr'];
const toVerb=(w,pos)=>VERBPOS.includes(pos)&&!/^to\s/i.test(w)?'to '+w:w;
const baseW=w=>String(w).replace(/^to\s+/i,'');
const POS=[
  ['Noun','Существительное','n.','Предмет, человек, место, явление.<br><i>Кто? Что?</i>','mother, cat, London, love'],
  ['Pronoun','Местоимение','pron.','Заменяет существительное, чтобы не повторять его.','I, you, she, it, they, this'],
  ['Verb','Глагол','v.','Действие или состояние.<br><i>Что делать?</i>','run, eat, be, have, think'],
  ['Adjective','Прилагательное','adj.','Признак предмета.<br><i>Какой?</i>','big, happy, red, beautiful'],
  ['Adverb','Наречие','adv.','Признак действия: как, когда, где.<br><i>Как? Когда? Где?</i>','quickly, often, here, very'],
  ['Preposition','Предлог','prep.','Показывает связь слов: место, время, направление.','in, on, at, under, to'],
  ['Conjunction','Союз','conj.','Соединяет слова и части предложения.','and, but, or, because'],
  ['Interjection','Междометие','interj.','Выражает эмоции, восклицание.','wow, oh, oops, hey'],
  ['Article','Артикль','art.','Маленькое слово перед существительным.','a, an, the'],

      { type:'gap', title:'Упражнение 1', instr:'Вставь am, is или are. Если стоит (not) — поставь отрицание.', items:TOBE_GAP },
      { type:'translate', title:'Упражнение 2', instr:"Переведи на английский. Сокращения (I'm, isn't) тоже засчитываются.", items:TOBE_TR } ]},

const SAVED=[{"id":"t1","title":"Урок 1. Основы построения предложений","sections":[{"title":"Vocabulary: About me","kicker":"Словарь","icon":"📚","open":true,"blocks":[{"type":"vocab","title":"","tag":"Слова","instr":"","items":[{"img":"images/vocab/hair-extensions.jpg","w":"hair extensions","forms":"","pos":"n","ru":"наращивание волос","ex":"I do hair extensions."},{"img":"images/vocab/hair-extension-specialist.jpg","w":"hair extension specialist","forms":"","pos":"n","ru":"мастер по наращиванию волос","ex":"I am a hair extension specialist."},{"img":"images/vocab/client.jpg","w":"client","forms":"","pos":"n","ru":"клиент, клиентка","ex":"My clients are happy."},{"img":"images/vocab/daughter.jpg","w":"daughter","forms":"","pos":"n","ru":"дочь","ex":"I have a daughter."},{"img":"images/vocab/gym.jpg","w":"gym","forms":"","pos":"n","ru":"спортзал","ex":"I go to the gym three times a week."},{"img":"images/vocab/aerial-hoop.jpg","w":"aerial hoop","forms":"","pos":"n","ru":"воздушное кольцо","ex":"I do acrobatics on the aerial hoop."},{"img":"images/vocab/acrobatics.jpg","w":"acrobatics","forms":"","pos":"n","ru":"акробатика","ex":"Acrobatics is my hobby."},{"img":"images/vocab/trip.jpg","w":"trip","forms":"","pos":"n","ru":"поездка, путешествие","ex":"I love trips to the sea."},{"img":"images/vocab/travel.jpg","w":"to travel","forms":"travel — travelled","pos":"v","ru":"путешествовать","ex":"I love to travel."},{"img":"images/vocab/relax.jpg","w":"to relax","forms":"relax — relaxed","pos":"v","ru":"отдыхать, расслабляться","ex":"I relax at home on Sundays."},{"img":"images/vocab/enjoy.jpg","w":"to enjoy","forms":"enjoy — enjoyed","pos":"v","ru":"наслаждаться, получать удовольствие","ex":"I enjoy my job."},{"img":"images/vocab/visit.jpg","w":"to visit","forms":"visit — visited","pos":"v","ru":"посещать, навещать","ex":"I want to visit Italy."},{"img":"images/vocab/go.jpg","w":"to go","forms":"go — went — gone","pos":"virr","ru":"идти, ходить, ехать","ex":"I go to the gym after work."},{"img":"images/vocab/spend.jpg","w":"to spend","forms":"spend — spent — spent","pos":"virr","ru":"проводить (время), тратить","ex":"I spend time with my daughter."},{"img":"images/vocab/make.jpg","w":"to make","forms":"make — made — made","pos":"virr","ru":"делать, создавать","ex":"I make women beautiful."},{"img":"images/vocab/meet.jpg","w":"to meet","forms":"meet — met — met","pos":"virr","ru":"встречать, знакомиться","ex":"I meet new clients every week."},{"img":"images/vocab/grow.jpg","w":"to grow","forms":"grow — grew — grown","pos":"virr","ru":"расти","ex":"My daughter grows very fast."},{"img":"images/vocab/hang-out.jpg","w":"to hang out","forms":"hang out — hung out","pos":"phr","ru":"тусоваться, проводить время","ex":"I hang out with my friends."},{"img":"images/vocab/work-out.jpg","w":"to work out","forms":"work out — worked out","pos":"phr","ru":"тренироваться (в зале)","ex":"I work out three times a week."},{"img":"images/vocab/look-after.jpg","w":"to look after","forms":"look after — looked after","pos":"phr","ru":"заботиться, присматривать","ex":"I look after my daughter."},{"img":"images/vocab/get-up.jpg","w":"to get up","forms":"get up — got up","pos":"phr","ru":"вставать (с кровати)","ex":"I get up at 7 o’clock."},{"img":"images/vocab/go-out.jpg","w":"to go out","forms":"go out — went out","pos":"phr","ru":"выходить (развлечься)","ex":"At the weekend I go out."},{"img":"images/vocab/busy.jpg","w":"busy","forms":"","pos":"adj","ru":"занятой, загруженный","ex":"I am very busy."},{"img":"images/vocab/creative.jpg","w":"creative","forms":"","pos":"adj","ru":"творческий, креативный","ex":"My job is creative."},{"img":"images/vocab/flexible.jpg","w":"flexible","forms":"","pos":"adj","ru":"гибкий","ex":"Acrobatics makes me flexible."},{"img":"images/vocab/proud-of.jpg","w":"proud (of)","forms":"","pos":"adj","ru":"гордый (кем-то, чем-то)","ex":"I am proud of my daughter."},{"img":"images/vocab/grandparents.jpg","w":"grandparents","forms":"","pos":"n","ru":"бабушка и дедушка","ex":"My grandparents live in the country."},{"img":"images/vocab/pilot.jpg","w":"pilot","forms":"","pos":"n","ru":"пилот, лётчица","ex":"My sister is a pilot."},{"img":"images/vocab/firefighter-fireman.jpg","w":"firefighter (fireman)","forms":"","pos":"n","ru":"пожарный","ex":"A firefighter is very brave."},{"img":"images/vocab/farmer.jpg","w":"farmer","forms":"","pos":"n","ru":"фермер","ex":"My brother is a farmer."},{"img":"images/vocab/the-country.jpg","w":"the country","forms":"","pos":"n","ru":"сельская местность, «за городом»","ex":"They live in the country."},{"img":"images/vocab/town.jpg","w":"town","forms":"","pos":"n","ru":"город (небольшой)","ex":"Do they live in town?"},{"img":"images/vocab/live.jpg","w":"to live","forms":"live — lived","pos":"v","ru":"жить","ex":"Where do you live?"},{"img":"images/vocab/younger.jpg","w":"younger","forms":"","pos":"adj","ru":"младший","ex":"This is my younger sister."},{"img":"images/vocab/tall.jpg","w":"tall","forms":"","pos":"adj","ru":"высокий (о человеке)","ex":"My dad is very tall."},{"img":"images/vocab/smart.jpg","w":"smart","forms":"","pos":"adj","ru":"умный","ex":"What a smart family!"},{"img":"images/vocab/cute.jpg","w":"cute","forms":"","pos":"adj","ru":"милый, очаровательный","ex":"Your daughter is so cute!"},{"img":"images/vocab/cool.jpg","w":"cool","forms":"","pos":"adj","ru":"классный, крутой","ex":"They have cool jobs."},{"img":"images/vocab/often.jpg","w":"often","forms":"","pos":"adv","ru":"часто","ex":"I go there often."}]},{"type":"rule","title":"Вопросы, чтобы рассказать о себе","tag":"Говорим","html":"<p>Ответь на вопросы вслух — из ответов сложится твой рассказ о себе. Используй слова из словаря выше.<\/p><ol class=\"qlist\"><li>What is your name? How old are you?<\/li><li>What do you do? Where do you work?<\/li><li>Do you like your job? Why?<\/li><li>Do you have children?<\/li><li>What do you do in your free time?<\/li><li>What sport do you do?<\/li><li>Do you like travelling? Where did you go last year?<\/li><li>What do you do at the weekend?<\/li><\/ol>"},{"type":"notes","title":"Заметки","tag":"Notes","text":""},{"type":"rule","title":"About me","tag":"Читаем","html":"<p class=\"muted\">Пример рассказа о себе. Выделенные слова — из словаря. Прочитай, а потом попробуй рассказать о себе так же.<\/p><p>Hi! My name is ___. I am 29 years old. I am a <mark>hair extension specialist<\/mark>. I <mark>work<\/mark> in a <mark>salon<\/mark> and <mark>make<\/mark> <mark>hair extensions<\/mark> for my <mark>clients<\/mark>. My job is <mark>creative<\/mark>, and I really <mark>enjoy<\/mark> it. I am very <mark>busy<\/mark>, but I am happy.<\/p><p>I have a <mark>daughter<\/mark>. I <mark>look after<\/mark> her, and I am very <mark>proud of<\/mark> her. She <mark>grows<\/mark> so fast!<\/p><p>In my <mark>free time<\/mark> I <mark>go<\/mark> to the <mark>gym<\/mark>. I <mark>work out<\/mark> and do <mark>acrobatics<\/mark> on the <mark>aerial hoop<\/mark>. It makes me strong and <mark>flexible<\/mark>.<\/p><p>I love to <mark>travel<\/mark>. Last year I went on a <mark>trip<\/mark> to ___ and <mark>visited<\/mark> many interesting places. At the weekend I like to <mark>go out<\/mark> and <mark>hang out<\/mark> with my friends. We <mark>meet<\/mark>, <mark>relax<\/mark> and have fun.<\/p>"},{"type":"writing","title":"Writing: моя дочка","tag":"Writing","instr":"Напиши ответ прямо здесь — текст сохранится.","html":"<p><b>Задание:<\/b> напиши небольшой рассказ о своей дочке — 6–8 предложений. Используй <b>to be<\/b> и слова из словаря.<\/p><p><b>План — ответь на вопросы по порядку:<\/b><\/p><ol class=\"qlist\"><li>What is her name? How old is she?<\/li><li>What is she like? <span class=\"muted\">(happy, funny, clever, kind, active…)<\/span><\/li><li><span class=\"muted\"><span style=\"color: rgb(29, 29, 31); font-size: 16px;\">What does she look like?&nbsp;<\/span><\/span><span style=\"color: rgb(122, 117, 108); font-size: 14.5px;\">(tall, curly heir,…)<\/span><\/li><li>What does she like? What does she love to do?&nbsp;<span style=\"color: rgb(122, 117, 108); font-size: 14.5px;\">(studing, dansing)<\/span><\/li><li>What do you do together?<\/li><li>How do you spend your weekends with her?<\/li><\/ol><p><b>Полезные фразы:<\/b>&nbsp;<\/p>","text":""}]},{"title":"Части речи","open":true,"blocks":[{"type":"rule","plain":true,"title":"","tag":"Таблица","html":"<p>Каждое слово в предложении выполняет свою роль — это и есть <b>часть речи<\/b>. Если понимать, какое слово перед тобой, гораздо легче строить предложения.<\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Part of speech<\/th><th>Перевод<\/th><th>Сокр.<\/th><th>Что обозначает<\/th><th>Примеры<\/th><\/tr><\/thead><tbody><tr><td><b>Noun<\/b><\/td><td>Существительное<\/td><td><span class=\"pos p0\">n.<\/span><\/td><td>Предмет, человек, место, явление.<br><i>Кто? Что?<\/i><\/td><td><i>mother, cat, London, love<\/i><\/td><\/tr><tr><td><b>Pronoun<\/b><\/td><td>Местоимение<\/td><td><span class=\"pos p1\">pron.<\/span><\/td><td>Заменяет существительное, чтобы не повторять его.<\/td><td><i>I, you, she, it, they, this<\/i><\/td><\/tr><tr><td><b>Verb<\/b><\/td><td>Глагол<\/td><td><span class=\"pos p2\">v.<\/span><\/td><td>Действие или состояние.<br><i>Что делать?<\/i><\/td><td><i>run, eat, be, have, think<\/i><\/td><\/tr><tr><td><b>Adjective<\/b><\/td><td>Прилагательное<\/td><td><span class=\"pos p3\">adj.<\/span><\/td><td>Признак предмета.<br><i>Какой?<\/i><\/td><td><i>big, happy, red, beautiful<\/i><\/td><\/tr><tr><td><b>Adverb<\/b><\/td><td>Наречие<\/td><td><span class=\"pos p4\">adv.<\/span><\/td><td>Признак действия: как, когда, где.<br><i>Как? Когда? Где?<\/i><\/td><td><i>quickly, often, here, very<\/i><\/td><\/tr><tr><td><b>Preposition<\/b><\/td><td>Предлог<\/td><td><span class=\"pos p5\">prep.<\/span><\/td><td>Показывает связь слов: место, время, направление.<\/td><td><i>in, on, at, under, to<\/i><\/td><\/tr><tr><td><b>Conjunction<\/b><\/td><td>Союз<\/td><td><span class=\"pos p6\">conj.<\/span><\/td><td>Соединяет слова и части предложения.<\/td><td><i>and, but, or, because<\/i><\/td><\/tr><tr><td><b>Interjection<\/b><\/td><td>Междометие<\/td><td><span class=\"pos p7\">interj.<\/span><\/td><td>Выражает эмоции, восклицание.<\/td><td><i>wow, oh, oops, hey<\/i><\/td><\/tr><tr><td><b>Article<\/b><\/td><td>Артикль<\/td><td><span class=\"pos p8\">art.<\/span><\/td><td>Маленькое слово перед существительным.<\/td><td><i>a, an, the<\/i><\/td><\/tr><tr><td><b>Numeral<\/b><\/td><td>Числительное<\/td><td><span class=\"pos p9\">num.<\/span><\/td><td>Количество или порядок.<br><i>Сколько? Который?<\/i><\/td><td><i>one, ten, first, second<\/i><\/td><\/tr><\/tbody><\/table><\/div>"}]},{"title":"Одно слово — разные части речи","open":true,"blocks":[{"type":"rule","plain":true,"title":"","tag":"Таблица","html":"<p>В английском одно и то же слово может быть <b>разными частями речи<\/b> — всё зависит от того, какую роль оно играет в предложении.<\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Слово<\/th><th>Пример 1<\/th><th>Пример 2<\/th><\/tr><\/thead><tbody><tr><td><b>love<\/b><\/td><td>I <mark>love<\/mark> music.<br><span class=\"pos p2\">verb<\/span><\/td><td><mark>Love<\/mark> is important.<br><span class=\"pos p0\">noun<\/span><\/td><\/tr><tr><td><b>work<\/b><\/td><td>I <mark>work<\/mark> in an office.<br><span class=\"pos p2\">verb<\/span><\/td><td>My <mark>work<\/mark> is interesting.<br><span class=\"pos p0\">noun<\/span><\/td><\/tr><tr><td><b>water<\/b><\/td><td>Please <mark>water<\/mark> the flowers.<br><span class=\"pos p2\">verb<\/span><\/td><td>I drink <mark>water<\/mark> every day.<br><span class=\"pos p0\">noun<\/span><\/td><\/tr><tr><td><b>fast<\/b><\/td><td>He is a <mark>fast<\/mark> runner.<br><span class=\"pos p3\">adjective<\/span><\/td><td>He runs <mark>fast<\/mark>.<br><span class=\"pos p4\">adverb<\/span><\/td><\/tr><tr><td><b>play<\/b><\/td><td>Let's <mark>play<\/mark> tennis.<br><span class=\"pos p2\">verb<\/span><\/td><td>We watched a <mark>play<\/mark> at the theatre.<br><span class=\"pos p0\">noun<\/span><\/td><\/tr><tr><td><b>light<\/b><\/td><td>Turn on the <mark>light<\/mark>.<br><span class=\"pos p0\">noun<\/span><\/td><td>My bag is very <mark>light<\/mark>.<br><span class=\"pos p3\">adjective<\/span><\/td><\/tr><tr><td><b>look<\/b><\/td><td><mark>Look<\/mark> at this picture!<br><span class=\"pos p2\">verb<\/span><\/td><td>Can I have a <mark>look<\/mark>?<br><span class=\"pos p0\">noun<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>💡 Подсказка: после <i>a / the / my<\/i> обычно идёт существительное, после <i>I / you / we<\/i> — глагол.<\/p>"}]},{"title":"Члены предложения","open":false,"blocks":[{"type":"rule","plain":true,"title":"","tag":"Таблица","html":"<p>Если части речи — это «кто такие слова», то <b>члены предложения<\/b> — это «какую работу слово делает» в конкретном предложении.<\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Член предложения<\/th><th>Перевод<\/th><th>Вопрос и роль<\/th><th>Чем обычно выражен<\/th><th>Пример<\/th><\/tr><\/thead><tbody><tr><td><span class=\"pos p0\">Subject<\/span><\/td><td>Подлежащее<\/td><td><b>Кто? Что?<\/b><br>Главный герой — тот, кто действует<\/td><td><i>noun, pronoun<\/i><\/td><td><mark>Tom<\/mark> plays.<\/td><\/tr><tr><td><span class=\"pos p6\">Predicate<\/span><\/td><td>Сказуемое<\/td><td><b>Что делает?<\/b><br>Само действие или состояние<\/td><td><i>verb<\/i><\/td><td>Tom <mark>plays<\/mark>.<\/td><\/tr><tr><td><span class=\"pos p2\">Object<\/span><\/td><td>Дополнение<\/td><td><b>Кого? Что?<\/b><br>На кого или на что направлено действие<\/td><td><i>noun, pronoun<\/i><\/td><td>Tom plays <mark>football<\/mark>.<\/td><\/tr><tr><td><span class=\"pos p4\">Complement<\/span><\/td><td>Именная часть<br><span class=\"muted\">(дополнение к подлежащему)<\/span><\/td><td><b>Кто такой? Какой?<\/b><br>Описывает подлежащее после <i>be, become, feel, look<\/i><\/td><td><i>noun, adjective<\/i><\/td><td>Tom is <mark>happy<\/mark>.<br>Tom is <mark>a pupil<\/mark>.<\/td><\/tr><tr><td><span class=\"pos p3\">Adverbial<\/span><\/td><td>Обстоятельство<\/td><td><b>Где? Когда? Как? Почему?<\/b><br>Детали: место, время, способ<\/td><td><i>adverb, preposition + noun<\/i><\/td><td>Tom plays <mark>in the park<\/mark> <mark>every day<\/mark>.<\/td><\/tr><tr><td><span class=\"pos p5\">Attribute<\/span><\/td><td>Определение<\/td><td><b>Какой? Чей?<\/b><br>Описывает предмет, стоит перед ним<\/td><td><i>adjective, pronoun (my, his)<\/i><\/td><td><mark>My little<\/mark> brother plays.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"muted\">⭐ Главные члены: <b>Subject<\/b> и <b>Predicate<\/b> — без них предложения не бывает. Остальные — второстепенные, они добавляют детали.<\/p>"},{"type":"rule","title":"Как это понять","tag":"Объяснение","html":"<p>Представь, что предложение — это <b>маленькая история<\/b>. 📖<\/p><p>В каждой истории есть <b>герой<\/b> — тот, <b>КТО<\/b> что-то делает. И есть <b>действие<\/b> — <b>ЧТО<\/b> он делает. Остальное — это детали: что именно, где, когда.<\/p><div class=\"formula\"><span class=\"f p0\"><b>1. КТО?<\/b><small>Subject<\/small><\/span><span class=\"arr\">→<\/span><span class=\"f p6\"><b>2. ЧТО ДЕЛАЕТ?<\/b><small>Predicate<\/small><\/span><span class=\"arr\">→<\/span><span class=\"f p2\"><b>3. ЧТО? КОГО?<\/b><small>Object<\/small><\/span><span class=\"arr\">→<\/span><span class=\"f p3\"><b>4. ГДЕ? КОГДА?<\/b><small>Adverbial<\/small><\/span><\/div><p>🇷🇺 В русском слова можно переставлять как угодно: <i>«Я люблю маму», «Маму люблю я», «Люблю я маму»<\/i> — всё понятно.<\/p><p>🇬🇧 В английском так <b>нельзя<\/b>. Порядок слов — как вагончики у поезда 🚂: каждый вагон знает своё место. Если поменять их местами, смысл ломается:<\/p><p>✅ <b>The dog bit the man.<\/b> — Собака укусила человека.<br>🔄 <b>The man bit the dog.<\/b> — Человек укусил собаку! 😮<\/p><p><b>Главное правило:<\/b> сначала говорим, <b>о ком<\/b> речь, потом ставим <b>глагол<\/b>, а потом добавляем <b>детали<\/b>. Подлежащее и сказуемое есть в английском предложении <b>всегда<\/b> — даже там, где в русском их нет: <i>«Холодно»<\/i> → <b>It is cold.<\/b><\/p>"},{"type":"rule","plain":true,"title":"Примеры","tag":"Примеры","html":"<p>Каждый цвет — свой член предложения. Обрати внимание: порядок всегда один и тот же, просто деталей становится больше.<\/p><h4 class=\"lvl\">🟢 Простые<\/h4><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">I<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">run.<\/span><span class=\"l p6\">Predicate<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">Dogs<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">bark.<\/span><span class=\"l p6\">Predicate<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">She<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">is<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p4\">happy.<\/span><span class=\"l p4\">Complement<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">Tom<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">likes<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p2\">apples.<\/span><span class=\"l p2\">Object<\/span><\/span><\/div><h4 class=\"lvl\">🟡 Посложнее<\/h4><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">My mom<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">cooks<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p2\">dinner<\/span><span class=\"l p2\">Object<\/span><\/span><span class=\"ch\"><span class=\"w p3\">every evening.<\/span><span class=\"l p3\">Adverbial<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">The children<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">play<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p2\">football<\/span><span class=\"l p2\">Object<\/span><\/span><span class=\"ch\"><span class=\"w p3\">in the park.<\/span><span class=\"l p3\">Adverbial<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">My brother<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">is<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p4\">a doctor.<\/span><span class=\"l p4\">Complement<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">We<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">watched<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p2\">a funny film<\/span><span class=\"l p2\">Object<\/span><\/span><span class=\"ch\"><span class=\"w p3\">yesterday.<\/span><span class=\"l p3\">Adverbial<\/span><\/span><\/div><h4 class=\"lvl\">🔴 Сложные<\/h4><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">My little sister<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">reads<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p2\">interesting books<\/span><span class=\"l p2\">Object<\/span><\/span><span class=\"ch\"><span class=\"w p3\">in her room<\/span><span class=\"l p3\">Adverbial<\/span><\/span><span class=\"ch\"><span class=\"w p3\">every night.<\/span><span class=\"l p3\">Adverbial<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">The tall man in a black coat<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">gave<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p2\">me<\/span><span class=\"l p2\">Object<\/span><\/span><span class=\"ch\"><span class=\"w p2\">a beautiful red flower<\/span><span class=\"l p2\">Object<\/span><\/span><span class=\"ch\"><span class=\"w p3\">at the station<\/span><span class=\"l p3\">Adverbial<\/span><\/span><span class=\"ch\"><span class=\"w p3\">this morning.<\/span><span class=\"l p3\">Adverbial<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p3\">Last summer,<\/span><span class=\"l p3\">Adverbial<\/span><\/span><span class=\"ch\"><span class=\"w p0\">my best friend and I<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">visited<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p2\">our grandparents<\/span><span class=\"l p2\">Object<\/span><\/span><span class=\"ch\"><span class=\"w p3\">in a small village<\/span><span class=\"l p3\">Adverbial<\/span><\/span><span class=\"ch\"><span class=\"w p3\">near the sea.<\/span><span class=\"l p3\">Adverbial<\/span><\/span><\/div><div class=\"sent\"><span class=\"ch\"><span class=\"w p0\">The weather<\/span><span class=\"l p0\">Subject<\/span><\/span><span class=\"ch\"><span class=\"w p6\">was<\/span><span class=\"l p6\">Predicate<\/span><\/span><span class=\"ch\"><span class=\"w p4\">cold and windy<\/span><span class=\"l p4\">Complement<\/span><\/span><span class=\"ch\"><span class=\"w p3\">all day<\/span><span class=\"l p3\">Adverbial<\/span><\/span><span class=\"ch\"><span class=\"w p3\">yesterday.<\/span><span class=\"l p3\">Adverbial<\/span><\/span><\/div><p class=\"muted\">💡 Слова-описания (<i>little, tall, funny, my<\/i>) — это определения (Attribute). Они «приклеены» к своему слову и входят в его группу: <i>my little sister<\/i> — это всё подлежащее.<\/p>"}]},{"title":"Глагол to be","open":true,"blocks":[{"type":"rule","plain":true,"title":"","tag":"Таблица","html":"<p>По-русски мы говорим <i>«Я дома»<\/i>, <i>«Она счастлива»<\/i>, <i>«Он врач»<\/i> — и никакого глагола нам не нужно. Раньше в русском было слово «есть»: <i>«Он есть врач»<\/i>, но оно пропало.<\/p><p>А в английском это «есть» <b>никогда не пропадает<\/b>. Помнишь правило 3? В английском предложении <b>всегда<\/b> есть глагол. Если другого глагола нет, на его место встаёт <b>to be<\/b> (быть).<\/p><div class=\"formula\"><span class=\"f p0\"><b>КТО?<\/b><small>I / she / my mom<\/small><\/span><span class=\"arr\">+<\/span><span class=\"f p6\"><b>am / is / are<\/b><small>to be<\/small><\/span><span class=\"arr\">+<\/span><span class=\"f p2\"><b>КТО? КАКОЙ? ГДЕ?<\/b><small>a doctor / happy / at home<\/small><\/span><\/div><p>👀 Ты уже видела его в примерах: <i>She <b>is<\/b> happy. My brother <b>is<\/b> a doctor. The weather <b>was<\/b> cold.<\/i><\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Местоимение<\/th><th>Перевод<\/th><th>to be<\/th><th>Пример<\/th><th>Перевод<\/th><\/tr><\/thead><tbody><tr><td><b>I<\/b><\/td><td>я<\/td><td><span class=\"pos p4\">am<\/span><\/td><td>I <mark>am<\/mark> at home.<\/td><td>Я дома.<\/td><\/tr><tr><td><b>You<\/b><\/td><td>ты<\/td><td><span class=\"pos p2\">are<\/span><\/td><td>You <mark>are<\/mark> my friend.<\/td><td>Ты мой друг.<\/td><\/tr><tr><td><b>He<\/b><\/td><td>он<\/td><td><span class=\"pos p0\">is<\/span><\/td><td>He <mark>is<\/mark> a doctor.<\/td><td>Он врач.<\/td><\/tr><tr><td><b>She<\/b><\/td><td>она<\/td><td><span class=\"pos p0\">is<\/span><\/td><td>She <mark>is<\/mark> happy.<\/td><td>Она счастлива.<\/td><\/tr><tr><td><b>It<\/b><\/td><td>оно, это (предмет, животное)<\/td><td><span class=\"pos p0\">is<\/span><\/td><td>It <mark>is<\/mark> cold.<\/td><td>Холодно.<\/td><\/tr><tr><td><b>We<\/b><\/td><td>мы<\/td><td><span class=\"pos p2\">are<\/span><\/td><td>We <mark>are<\/mark> students.<\/td><td>Мы студенты.<\/td><\/tr><tr><td><b>You<\/b><\/td><td>вы<\/td><td><span class=\"pos p2\">are<\/span><\/td><td>You <mark>are<\/mark> late.<\/td><td>Вы опоздали.<\/td><\/tr><tr><td><b>They<\/b><\/td><td>они<\/td><td><span class=\"pos p2\">are<\/span><\/td><td>They <mark>are<\/mark> at school.<\/td><td>Они в школе.<\/td><\/tr><\/tbody><\/table><\/div><p>🧠 <b>Как запомнить:<\/b> <b>I<\/b> — только <span class=\"pos p4\">am<\/span>. <b>He, she, it<\/b> (один кто-то или что-то) — <span class=\"pos p0\">is<\/span>. <b>Все остальные<\/b> — <span class=\"pos p2\">are<\/span>.<\/p>"},{"type":"rule","plain":true,"title":"Меняем существительное на местоимение","tag":"Таблица","html":"<p>Чтобы не повторять одно и то же слово, мы заменяем существительное местоимением. А форма to be зависит от того, <b>кто<\/b> стоит в начале.<\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Существительное<\/th><th>→<\/th><th>Пример<\/th><th>Заменяем<\/th><\/tr><\/thead><tbody><tr><td>my mother<\/td><td><b>she<\/b><\/td><td>My mother <mark>is<\/mark> a doctor.<\/td><td>She <mark>is<\/mark> a doctor.<\/td><\/tr><tr><td>my father<\/td><td><b>he<\/b><\/td><td>My father <mark>is<\/mark> at work.<\/td><td>He <mark>is<\/mark> at work.<\/td><\/tr><tr><td>the cat<\/td><td><b>it<\/b><\/td><td>The cat <mark>is<\/mark> black.<\/td><td>It <mark>is<\/mark> black.<\/td><\/tr><tr><td>the book<\/td><td><b>it<\/b><\/td><td>The book <mark>is<\/mark> interesting.<\/td><td>It <mark>is<\/mark> interesting.<\/td><\/tr><tr><td>Tom and I<\/td><td><b>we<\/b><\/td><td>Tom and I <mark>are<\/mark> friends.<\/td><td>We <mark>are<\/mark> friends.<\/td><\/tr><tr><td>you and Anna<\/td><td><b>you<\/b><\/td><td>You and Anna <mark>are<\/mark> late.<\/td><td>You <mark>are<\/mark> late.<\/td><\/tr><tr><td>my parents<\/td><td><b>they<\/b><\/td><td>My parents <mark>are<\/mark> at home.<\/td><td>They <mark>are<\/mark> at home.<\/td><\/tr><tr><td>the children<\/td><td><b>they<\/b><\/td><td>The children <mark>are<\/mark> in the park.<\/td><td>They <mark>are<\/mark> in the park.<\/td><\/tr><\/tbody><\/table><\/div><p>💡 <b>Один человек<\/b> → he / she. <b>Предмет или животное<\/b> → it. <b>Много кого угодно<\/b> → they.<br>💡 «Я» всегда ставим <b>последним<\/b> и с большой буквы: <i>Tom and I<\/i>, а не <i>I and Tom<\/i>.<\/p>"},{"type":"rule","plain":true,"title":"Сокращения","tag":"Таблица","html":"<p>В разговоре англичане почти всегда сокращают to be. Апостроф <b>’<\/b> стоит на месте пропавшей буквы.<\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Полная форма<\/th><th>Сокращение<\/th><th>Отрицание (not)<\/th><th>Отрицание коротко<\/th><\/tr><\/thead><tbody><tr><td>I am<\/td><td><b>I’m<\/b><\/td><td>I am not<\/td><td><b>I’m not<\/b><\/td><\/tr><tr><td>you are<\/td><td><b>you’re<\/b><\/td><td>you are not<\/td><td><b>you aren’t / you’re not<\/b><\/td><\/tr><tr><td>he is<\/td><td><b>he’s<\/b><\/td><td>he is not<\/td><td><b>he isn’t / he’s not<\/b><\/td><\/tr><tr><td>she is<\/td><td><b>she’s<\/b><\/td><td>she is not<\/td><td><b>she isn’t / she’s not<\/b><\/td><\/tr><tr><td>it is<\/td><td><b>it’s<\/b><\/td><td>it is not<\/td><td><b>it isn’t / it’s not<\/b><\/td><\/tr><tr><td>we are<\/td><td><b>we’re<\/b><\/td><td>we are not<\/td><td><b>we aren’t / we’re not<\/b><\/td><\/tr><tr><td>they are<\/td><td><b>they’re<\/b><\/td><td>they are not<\/td><td><b>they aren’t / they’re not<\/b><\/td><\/tr><\/tbody><\/table><\/div><p>❗ <b>I amn’t<\/b> — так не бывает. Только <b>I’m not<\/b>.<br>❗ Сокращаться может и существительное: <i>My mother’s a doctor<\/i> = <i>My mother is a doctor<\/i>.<br>❗ В коротком ответе «да» сокращать <b>нельзя<\/b>: <i>Yes, I am.<\/i> ✅ &nbsp; <i>Yes, I’m.<\/i> ❌<br>❗ <b>it’s<\/b> (= it is) и <b>its<\/b> (его, её — про предмет) — это разные слова.<\/p>"},{"type":"rule","title":"Полезно знать","tag":"Полезно","html":"<p><b>📌 Когда нужен to be (а в русском глагола нет):<\/b><\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Что говорим<\/th><th>По-русски<\/th><th>По-английски<\/th><\/tr><\/thead><tbody><tr><td>Кто ты, профессия<\/td><td>Я учитель.<\/td><td><b>I am a teacher.<\/b><\/td><\/tr><tr><td>Какой<\/td><td>Она красивая.<\/td><td><b>She is beautiful.<\/b><\/td><\/tr><tr><td>Где<\/td><td>Мы дома.<\/td><td><b>We are at home.<\/b><\/td><\/tr><tr><td>Возраст<\/td><td>Мне 25 лет.<\/td><td><b>I am 25. / I am 25 years old.<\/b><\/td><\/tr><tr><td>Откуда<\/td><td>Я из Украины.<\/td><td><b>I am from Ukraine.<\/b><\/td><\/tr><tr><td>Имя<\/td><td>Меня зовут Анна.<\/td><td><b>My name is Anna.<\/b><\/td><\/tr><tr><td>Чувства и состояние<\/td><td>Мне холодно. Я голодна.<\/td><td><b>I am cold. I am hungry.<\/b><\/td><\/tr><tr><td>Погода и время<\/td><td>Солнечно. Сейчас 5 часов.<\/td><td><b>It is sunny. It is 5 o’clock.<\/b><\/td><\/tr><\/tbody><\/table><\/div><p><b>❓ Вопрос:<\/b> просто меняем местами: am / is / are выходит <b>вперёд<\/b>.<\/p><div class=\"tbl-wrap\"><table class=\"nice\"><thead><tr><th>Утверждение<\/th><th>Вопрос<\/th><th>Короткий ответ<\/th><\/tr><\/thead><tbody><tr><td>You are tired.<\/td><td><mark>Are<\/mark> you tired?<\/td><td>Yes, I am. / No, I’m not.<\/td><\/tr><tr><td>She is at home.<\/td><td><mark>Is<\/mark> she at home?<\/td><td>Yes, she is. / No, she isn’t.<\/td><\/tr><tr><td>They are students.<\/td><td><mark>Are<\/mark> they students?<\/td><td>Yes, they are. / No, they aren’t.<\/td><\/tr><\/tbody><\/table><\/div><p><b>🚫 Частые ошибки:<\/b><\/p><p>❌ <s>I 25 years.<\/s> / <s>I have 25.<\/s> → ✅ <b>I am 25.<\/b><br>❌ <s>Me is cold.<\/s> → ✅ <b>I am cold.<\/b> («мне холодно» = «я холодный»)<br>❌ <s>She are happy.<\/s> → ✅ <b>She is happy.<\/b><br>❌ <s>I am like music.<\/s> → ✅ <b>I like music.<\/b> — если в предложении уже есть другой глагол, to be <b>не нужен<\/b>!<br>❌ <s>I am agree.<\/s> → ✅ <b>I agree.<\/b><\/p>"},{"type":"gap","title":"Упражнение 1","instr":"Вставь am, is или are. Если стоит (not) — поставь отрицание.","items":[{"text":"I ___ a student.","answer":"am"},{"text":"She ___ my sister.","answer":"is"},{"text":"They ___ at school.","answer":"are"},{"text":"It ___ cold today.","answer":"is"},{"text":"My mother ___ a doctor.","answer":"is"},{"text":"Tom and Anna ___ from London.","answer":"are"},{"text":"___ you hungry?","answer":"Are"},{"text":"He ___ (not) at home now.","answer":"is not/isn't"},{"text":"___ your brother ten years old? — Yes, he ___.","answer":"Is|is"},{"text":"My parents ___ (not) teachers, they ___ doctors.","answer":"are not/aren't|are"}]},{"type":"translate","title":"Упражнение 2","instr":"Переведи на английский. Сокращения (I'm, isn't) тоже засчитываются.","items":[{"ru":"Я дома.","answer":"I am at home."},{"ru":"Она счастлива.","answer":"She is happy."},{"ru":"Он врач.","answer":"He is a doctor."},{"ru":"Мы друзья.","answer":"We are friends."},{"ru":"Мне 25 лет.","answer":"I am 25./I am 25 years old."},{"ru":"Мне холодно.","answer":"I am cold."},{"ru":"Ты устала?","answer":"Are you tired?"},{"ru":"Моя мама не учитель.","answer":"My mother is not a teacher./My mom is not a teacher./My mum is not a teacher."},{"ru":"Где мои ключи?","answer":"Where are my keys?"},{"ru":"Мой брат и я сейчас в Лондоне.","answer":"My brother and I are in London now./Now my brother and I are in London."}]}]},{"title":"Listening: Jobs and Family","kicker":"Аудирование","icon":"🎧","open":true,"blocks":[{"type":"video","title":"Beginner Listening — Be Verbs: Jobs and Family","tag":"Видео","url":"https://www.youtube.com/watch?v=Qqggd04V1FU","meta":"A1 · 1:25 · 4 диалога"},{"type":"notes","title":"Заметки","tag":"Notes","text":""}]},{"title":"Translate","kicker":"Перевод","icon":"🌍","open":true,"blocks":[{"type":"translate","title":"Переведи на английский","tag":"Перевод","instr":"Напиши перевод под каждым предложением и нажми «Проверить». Проверка принимает основные варианты перевода. Если твой вариант отмечен красным — сравни с ответом: он тоже может быть верным.","items":[{"ru":"Моя сестра работает в больнице. Она врач.","answer":"My sister works {in|at} a hospital. She is a doctor."},{"ru":"После ужина он обычно читает газету или смотрит телевизор.","answer":"He usually reads {a|the} ne const ACTIONS=`<div class="actions"><button class="btn primary small" data-act="check">Проверить</button>
  <button class="btn small" data-act="show">Показать ответы</button>
  <button class="btn small ghost" data-act="reset">Сбросить</button><span class="score"></span></div>`;
const row=(i,inner)=>`<div class="edit-row" data-i="${i}"><span>${i+1}.</span>${inner}<button class="btn ghost small" data-act="delitem">✕</button></div>`;

function gapView(b){
  return `<ol class="items">${b.items.map((it,i)=>{
    const answers=it.answer.split('|'); let k=0; const parts=esc(it.text).split('___');
    return `<li data-i="${i}">${parts.map((p,j)=>p+(j<parts.length-1?`<input class="gap-in" data-k="${k++}" autocomplete="off" spellcheck="false">`:'')).join('')}<span class="ans" hidden>→ ${esc(answers.join(' … '))}</span></li>`;
  }).join('')}</ol>${ACTIONS}`;
}
function gapEdit(b){
  return `<p class="edit-hint">Пропуск — <b>___</b>. Несколько вариантов ответа — через <b>/</b>. Если пропусков несколько — ответы через <b>|</b>.</p>
  ${b.items.map((it,i)=>row(i,`<input type="text" data-e="text" value="${esc(it.text)}"><input type="text" class="short" data-e="answer" value="${esc(it.answer)}" placeholder="ответ">`)).join('')}
  <button class="btn small" data-act="additem">＋ предложение</button>`;
}
function mcqView(b){

    <div class="opts">${it.options.map((o,j)=>`<button class="opt" data-o="${j}"><b>${'ABCDEF'[j]}</b>${esc(o)}</button>`).join('')}</div></li>`).join('')}</ol>${ACTIONS}`;

function mcqEdit(b){

  return `<p class="edit-hint">Отметь кружком правильный вариант.</p>
  ${b.items.map((it,i)=>`<div class="mcq-edit" data-i="${i}">
    <div class="edit-row"><span>${i+1}.</span><input type="text" data-e="q" value="${esc(it.q)}"><button class="btn ghost small" data-act="delitem">✕</button></div>
    ${it.options.map((o,j)=>`<div class="edit-row" style="padding-left:22px"><input type="radio" name="${nm}${i}" data-e="correct" value="${j}" ${it.correct===j?'checked':''}>
      <b>${'ABCDEF'[j]}</b><input type="text" data-e="opt" data-j="${j}" value="${esc(o)}"></div>`).join('')}
    <div style="padding-left:22px"><button class="btn ghost small" data-act="addopt">＋ вариант</button></div></div>`).join('')}

function trView(b){
  return `<ol class="items">${b.items.map((it,i)=>`<li data-i="${i}"><div class="ru">${esc(it.ru)}</div>
    <textarea class="tr-in" rows="1" autocomplete="off" spellcheck="false" placeholder="Напиши по-английски…"></textarea>
    <span class="ans line" hidden>→ ${esc(showAns(it.answer))}</span></li>`).join('')}</ol>${ACTIONS}`;
}
function trEdit(b){
  return `<p class="edit-hint">Если правильных вариантов несколько — пиши через <b>/</b>. Сокращения и знаки препинания проверка учитывает сама.</p>
  ${b.items.map((it,i)=>row(i,`<input type="text" data-e="ru" value="${esc(it.ru)}" placeholder="по-русски"><input type="text" data-e="answer" value="${esc(it.answer)}" placeholder="по-английски">`)).join('')}
  <button class="btn small" data-act="additem">＋ предложение</button>`;
}
function sortView(b){
  const order=b.items.map((_,i)=>i).sort(()=>Math.random()-.5);
  return `<div class="pool" data-bucket="">${order.map(i=>`<span class="chip" draggable="true" data-w="${i}">${esc(b.items[i].w)}</span>`).join('')}</div>
  <div class="buckets">${b.cats.map((c,j)=>`<div class="bucket" data-bucket="${esc(c)}"><div class="bucket-h"><span class="pos p${j%10}">${esc(c)}</span></div><div class="bucket-body"></div></div>`).join('')}</div>${ACTIONS}`;
}
function sortEdit(b){
  return `<div class="edit-row"><b>Группы:</b><input type="text" data-f="cats" value="${esc(b.cats.join(', '))}"></div>
  <p class="edit-hint">Для каждого слова укажи группу. Если подходит несколько — через <b>/</b>.</p>
  ${b.items.map((it,i)=>row(i,`<input type="text" data-e="w" value="${esc(it.w)}"><input type="text" class="short" data-e="c" value="${esc(it.c)}">`)).join('')}
  <button class="btn small" data-act="additem">＋ слово</button>`;
}
function moveChip(chip,bucket){ (bucket.querySelector('.bucket-body')||bucket).appendChild(chip); chip.classList.remove('sel','ok','bad','shown'); }
let dragged=null;
document.addEventListener('dragstart',e=>{ if(e.target.classList?.contains('chip')) dragged=e.target; });
document.addEventListener('dragover',e=>{ const bk=e.target.closest?.('[data-bucket]'); if(dragged&&bk){ e.preventDefault(); bk.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ e.target.closest?.('[data-bucket]')?.classList.remove('over'); });
document.addEventListener('drop',e=>{ const bk=e.target.closest?.('[data-bucket]'); if(dragged&&bk&&bk.closest('.blk')===dragged.closest('.blk')){ e.preventDefault(); moveChip(dragged,bk); } document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); dragged=null; });


/* ---------- vocabulary ---------- */
const POSV={n:['n','p0','noun'],v:['v','p2','verb'],virr:['ir v','p6','irregular verb'],phr:['ph v','p4','phrasal verb'],adj:['adj','p3','adjective'],adv:['adv','p5','adverb'],other:['phr','p8','phrase']};
const VGROUPS=[['all','Все',()=>true],['n','Существительные',p=>p==='n'],['verbs','Глаголы',p=>['v','virr','phr'].includes(p)],['virr','Неправильные',p=>p==='virr'],['phr','Фразовые',p=>p==='phr'],['adj','Прилагательные',p=>p==='adj'],['other','Другое',p=>p==='adv'||p==='other']];
const pic=img=>isImg(img)?`<img src="${esc(img)}" alt="">`:esc(img||'🔤');
const posOpts=sel=>Object.entries(POSV).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v[0]} — ${v[2]}</option>`).join('');
function vocabView(b){
  const groups=VGROUPS.map(([k,l,fn])=>[k,l,b.items.filter(it=>fn(it.pos)).length]).filter(g=>g[0]==='all'||g[2]);
  return `<div class="vfilter">${groups.map(([k,l,n],i)=>`<button data-vf="${k}" class="${i?'':'on'}">${l}<span>${n}</span></button>`).join('')}</div>
  <div class="tbl-wrap"><table class="nice vocab"><thead><tr><th></th><th>Слово</th><th>Часть речи</th><th>Перевод</th><th>Пример</th><th></th></tr></thead><tbody>
  ${b.items.map((it,i)=>`<tr data-i="${i}" data-pos="${it.pos}"><td class="c-pic"><div class="pic">${pic(it.img)}</div></td>
    <td><div class="word">${esc(it.w)}</div>${it.forms?`<div class="forms">${esc(it.forms)}</div>`:''}</td>
    <td><span class="pos ${(POSV[it.pos]||POSV.other)[1]}" title="${(POSV[it.pos]||POSV.other)[2]}">${(POSV[it.pos]||POSV.other)[0]}</span></td>
    <td>${esc(it.ru)}</td><td class="vex">${esc(it.ex)}</td>
    <td><button class="vdel" data-act="vdel" title="Удалить слово">✕</button></td></tr>`).join('')}
  <tr class="add-row"><td colspan="6">
    <button class="add-word" data-act="vadd">＋ Добавить слово</button>
    <div class="add-form" hidden>
      <label>Слово<input data-v="w" placeholder="например, hairdresser"></label>
      <label>Перевод<input data-v="ru" placeholder="парикмахер"></label>
      <label>Часть речи<select data-v="pos">${posOpts('n')}</select></label>
      <label>Формы (для глаголов)<input data-v="forms" placeholder="go — went — gone"></label>
      <label style="grid-column:span 2">Пример<input data-v="ex" placeholder="I am a hairdresser."></label>
      <div class="full"><div class="pic" data-vprev>🔤</div>
        <label style="flex:1;min-width:200px">Картинка: эмодзи или ссылка<input data-v="img" placeholder="💇‍♀️ или https://…"></label>
        <label class="upl">или загрузить фото<input type="file" accept="image/*" data-vfile></label></div>
      <div class="full"><button class="btn primary small" data-act="vsave">Добавить</button><button class="btn small ghost" data-act="vcancel">Отмена</button></div>
    </div></td></tr>
  </tbody></table></div>${creditsHTML(b)}`;
}
function creditsHTML(b){
  const list=b.items.filter(it=>VCREDITS[baseW(it.w)]&&it.img===VIMG[baseW(it.w)]);
  if(!list.length) return '';
  return `<details class="credits"><summary>Источники фото (свободные лицензии: Openverse, Wikimedia Commons)</summary><ul>${list.map(it=>{const c=VCREDITS[baseW(it.w)];
    return `<li><b>${esc(it.w)}</b> — ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.by)}</a>`:esc(c.by)}, ${esc(c.lic)}</li>`}).join('')}</ul></details>`;
}
function vocabEdit(b){
  return `<p class="edit-hint">Картинка — эмодзи или ссылка на изображение. Новые слова можно добавлять и без режима редактирования — кнопкой «＋ Добавить слово» под таблицей.</p>
  ${b.items.map((it,i)=>row(i,`<input type="text" class="short" style="flex:0 0 90px" data-e="img" value="${esc(it.img)}"><input type="text" data-e="w" value="${esc(it.w)}" placeholder="слово">
    <input type="text" data-e="forms" value="${esc(it.forms)}" placeholder="формы"><select class="vedit" data-e="pos">${posOpts(it.pos)}</select>
    <input type="text" data-e="ru" value="${esc(it.ru)}" placeholder="перевод"><input type="text" data-e="ex" value="${esc(it.ex)}" placeholder="пример">`)).join('')}
  <button class="btn small" data-act="additem">＋ слово</button>`;
}
function resizeImage(file,cb){
  const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{ const S=120,c=document.createElement('canvas'); c.width=c.height=S;
    const k=Math.max(S/im.width,S/im.height), w=im.width*k, h=im.height*k;
    c.getContext('2d').drawImage(im,(S-w)/2,(S-h)/2,w,h); cb(c.toDataURL('image/jpeg',.82)); }; im.src=r.result; };
  r.readAsDataURL(file);
}
page.addEventListener('input',e=>{ if(e.target.matches('textarea.tr-in')){ grow(e.target); e.target.classList.remove('ok','bad'); } });
page.addEventListener('change',e=>{
  if(!e.target.matches('[data-vfile]')||!e.target.files[0]) return;
  const form=e.target.closest('.add-form');
  resizeImage(e.target.files[0],url=>{ form.querySelector('[data-v=img]').value=url; form.querySelector('[data-vprev]').innerHTML=pic(url); });
});
page.addEventListener('input',e=>{
  if(e.target.matches('[data-v=img]')) e.target.closest('.add-form').querySelector('[data-vprev]').innerHTML=pic(e.target.value);
});

/* ---------- checking ---------- */
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/’/g,"'");
const expand=s=>{const m=s.match(/\{([^{}]*)\}/); if(!m) return [s]; return m[1].split('|').flatMap(o=>expand(s.slice(0,m.index)+o+s.slice(m.index+m[0].length)));};
const variants=a=>a.split('/').flatMap(expand);
const showAns=a=>expand(a.split('/')[0])[0].replace(/\s+/g,' ').replace(/\s([.,?!])/g,'$1').trim();
const normTr=s=>norm(s).replace(/[.,!?;:—–"«»]/g,' ').replace(/(^|\s)-+(?=\s|$)/g,' ')
  .replace(/n't\b/g,' not').replace(/\bi'm\b/g,'i am').replace(/'re\b/g,' are').replace(/'s\b/g,' is')
  .replace(/\b(mum|mom)\b/g,'mother').replace(/\s+/g,' ').trim();
function check(el,b,reveal){
  let ok=0,total=0;
  if(b.type==='gap'){
    el.querySelectorAll('li').forEach(li=>{
      const answers=b.items[li.dataset.i].answer.split('|');
      li.querySelectorAll('.gap-in').forEach(inp=>{
        total++;
        const good=(answers[inp.dataset.k]||'').split('/').map(norm).includes(norm(inp.value));
        if(good) ok++; inp.classList.toggle('ok',good); inp.classList.toggle('bad',!good);
      });
      if(reveal) li.querySelector('.ans').hidden=false;
    });
  } else if(b.type==='translate'){
    el.querySelectorAll('li').forEach(li=>{
      total++;
      const it=b.items[li.dataset.i], inp=li.querySelector('.tr-in');
      const good=variants(it.answer).map(normTr).includes(normTr(inp.value));
      if(good) ok++; inp.classList.toggle('ok',good); inp.classList.toggle('bad',!good);
      if(reveal) li.querySelector('.ans').hidden=false;
    });
  } else if(b.type==='sort'){
    el.querySelectorAll('.chip').forEach(ch=>{
      total++;
      const cats=b.items[ch.dataset.w].c.split('/').map(norm);
      const bkt=ch.closest('.bucket'), good=!!bkt&&cats.includes(norm(bkt.dataset.bucket));
      if(good) ok++;
      if(reveal&&!good){ const tg=[...el.querySelectorAll('.bucket')].find(x=>cats.includes(norm(x.dataset.bucket))); if(tg){ moveChip(ch,tg); ch.classList.add('shown'); } }
      else { ch.classList.toggle('ok',good); ch.classList.toggle('bad',!!bkt&&!good); }
    });
  } else {
    el.querySelectorAll('li').forEach(li=>{
      total++;
      const it=b.items[li.dataset.i], picked=li.querySelector('.opt.picked');
      li.querySelectorAll('.opt').forEach(o=>{
        const j=+o.dataset.o;
        o.classList.toggle('ok', j===it.correct && (reveal || o===picked));
        o.classList.toggle('bad', o===picked && j!==it.correct);
      });
      if(picked && +picked.dataset.o===it.correct) ok++;
    });
  }
  el.querySelector('.score').textContent=`Правильно: ${ok} из ${total}`;
}

/* ---------- events ---------- */
function newBlock(type,t){
  const n=t.sections.reduce((a,s)=>a+s.blocks.filter(x=>x.type!=='rule'&&x.type!=='vocab'&&x.type!=='notes'&&x.type!=='video').length,0)+1, title='Упражнение '+n;
  if(type==='vocab') return {type,title:'',tag:'Слова',instr:'',items:[]};
  if(type==='video') return {type,title:'Видео',tag:'Видео',url:'',meta:''};
  if(type==='notes') return {type,title:'Заметки',text:''};
  if(type==='writing') return {type,title:'Writing',instr:'Напиши ответ прямо здесь — текст сохранится.',html:'<p><b>Задание:</b> …</p>',text:''};
  return type==='rule'?{type,title:'',html:'<p>Текст…</p>'}
    :type==='gap'?{type,title,instr:'Вставь пропущенное слово.',items:[{text:'I ___ a student.',answer:'am'}]}
    :type==='translate'?{type,title,instr:'Переведи на английский.',items:[{ru:'Я дома.',answer:'I am at home.'}]}
    :type==='sort'?{type,title,instr:'Распредели слова по группам.',cats:['Noun','Verb'],items:[{w:'cat',c:'Noun'},{w:'run',c:'Verb'}]}
    :{type,title,instr:'Выбери правильный вариант.',items:[{q:'Вопрос',options:['вариант 1','вариант 2','вариант 3'],correct:0}]};
}
const swap=(arr,i,j)=>{ if(j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; };
page.addEventListener('click',e=>{
  const t=topic();
  const secEl=e.target.closest('.sec'), si=secEl?+secEl.dataset.s:-1, S=secEl?t.sections[si]:null;
  const blkEl=e.target.closest('.blk'), bi=blkEl?+blkEl.dataset.b:-1, b=blkEl?S.blocks[bi]:null;
  const opt=e.target.closest('.opt');
  if(opt){ opt.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked','ok','bad')); opt.classList.add('picked'); return; }
  const chip=e.target.closest('.chip');
  if(chip){ const was=chip.classList.contains('sel'); page.querySelectorAll('.chip.sel').forEach(c=>c.classList.remove('sel')); if(!was) chip.classList.add('sel'); return; }
  const bucket=e.target.closest('[data-bucket]');
  if(bucket){ const sel=blkEl.querySelector('.chip.sel'); if(sel) moveChip(sel,bucket); return; }
  const add=e.target.closest('[data-add]');
  if(add){ S.blocks.push(newBlock(add.dataset.add,t)); save(); render(); return; }
  const vf=e.target.closest('[data-vf]');
  if(vf){ const fn=VGROUPS.find(g=>g[0]===vf.dataset.vf)[2];
    blkEl.querySelectorAll('[data-vf]').forEach(x=>x.classList.toggle('on',x===vf));
    blkEl.querySelectorAll('tr[data-pos]').forEach(tr=>tr.style.display=fn(tr.dataset.pos)?'':'none'); return; }
  const act=e.target.closest('[data-act]')?.dataset.act; if(!act) return;
  const rowEl=e.target.closest('[data-i]');
  switch(act){
    case 'toggle':
      if(e.target.closest('[contenteditable=true]')) return;
      S.open=S.open===false; secEl.classList.toggle('closed',!S.open); save(); secEl.querySelectorAll('textarea.lined').forEach(grow); break;
    case 'openall': case 'closeall':
      t.sections.forEach(s=>s.open=act==='openall'); save();
      page.querySelectorAll('.sec').forEach(x=>x.classList.toggle('closed',act==='closeall')); break;
    case 'vadd': { const f=blkEl.querySelector('.add-form'); f.hidden=false; e.target.closest('.add-word').hidden=true; f.querySelector('[data-v=w]').focus(); break; }
    case 'vcancel': blkEl.outerHTML=blockHTML(b,bi,''); break;
    case 'vsave': {
      const f=blkEl.querySelector('.add-form'), v=k=>f.querySelector(`[data-v=${k}]`).value.trim();
      if(!v('w')){ f.querySelector('[data-v=w]').focus(); return; }
      b.items.push({img:v('img'),w:toVerb(v('w'),v('pos')),forms:v('forms'),pos:v('pos'),ru:v('ru'),ex:v('ex')});
      save(); render(); break; }
    case 'vdel': { const it=b.items[+rowEl.dataset.i]; if(confirm(`Удалить слово «${it.w}»?`)){ b.items.splice(+rowEl.dataset.i,1); save(); render(); } break; }
    case 'check': check(blkEl,b,false); break;
    case 'show': check(blkEl,b,true); break;
    case 'reset': blkEl.outerHTML=blockHTML(b,bi,''); break;
    case 'up': if(swap(S.blocks,bi,bi-1)){save();render();} break;
    case 'down': if(swap(S.blocks,bi,bi+1)){save();render();} break;
    case 'delblock': if(confirm('Удалить этот блок?')){S.blocks.splice(bi,1);save();render();} break;
    case 'sup': if(swap(t.sections,si,si-1)){save();render();} break;
    case 'sdown': if(swap(t.sections,si,si+1)){save();render();} break;
    case 'delsec': if(confirm(`Удалить правило «${S.title}» целиком?`)){t.sections.splice(si,1);save();render();} break;
    case 'addsec': t.sections.push(newSection()); save(); render(); document.getElementById('sec-'+(t.sections.length-1)).scrollIntoView({behavior:'smooth'}); break;
    case 'additem': b.items.push(b.type==='gap'?{text:'___',answer:''}:b.type==='sort'?{w:'',c:''}:b.type==='translate'?{ru:'',answer:''}:b.type==='vocab'?{img:'',w:'',forms:'',pos:'n',ru:'',ex:''}:{q:'',options:['','',''],correct:0}); save(); render(); break;
    case 'delitem': b.items.splice(+rowEl.dataset.i,1); save(); render(); break;
    case 'addopt': b.items[+rowEl.dataset.i].options.push(''); save(); render(); break;
    case 'deltopic': if(confirm(`Удалить тему «${t.title}»?`)){data=data.filter(x=>x!==t);cur=data[0].id;save();render();} break;
  }
});
page.addEventListener('input',e=>{
  const t=topic(), el=e.target, secEl=el.closest('.sec'), S=secEl&&t.sections[secEl.dataset.s];
  const blkEl=el.closest('.blk'), b=blkEl&&S.blocks[blkEl.dataset.b];
  const f=el.dataset.f, ed=el.dataset.e;
  if(f==='title'){ t.title=el.textContent; renderTopics(); }
  else if(f==='stitle'){ S.title=el.textContent; renderTopics(); }
  else if(f==='btitle') b.title=el.textContent;
  else if(f==='instr') b.instr=el.textContent;
  else if(f==='html') b.html=el.innerHTML;
  else if(f==='text'){ b.text=el.value; grow(el);
    const foot=el.nextElementSibling, wcEl=foot.querySelector('.wcount'); if(wcEl) wcEl.textContent=wc(el.value);
    const sv=foot.querySelector('.saved'); sv.classList.add('on'); clearTimeout(savedT); savedT=setTimeout(()=>sv.classList.remove('on'),1200); }
  else if(f==='url') b.url=el.value.trim();
  else if(f==='meta') b.meta=el.value;
  else if(f==='cats') b.cats=el.value.split(',').map(s=>s.trim()).filter(Boolean);
  else if(ed){
    const it=b.items[+el.closest('[data-i]').dataset.i];
    if(ed==='opt') it.options[+el.dataset.j]=el.value;
    else if(ed==='correct') it.correct=+el.value;
    else it[ed]=el.value;
  } else return;
  save();
});
page.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.add-form input')){ e.preventDefault(); e.target.closest('.add-form').querySelector('[data-act=vsave]').click(); return; }
  if(e.key==='Enter'&&!e.shiftKey&&(e.target.classList.contains('gap-in')||e.target.classList.contains('tr-in'))){ e.preventDefault(); e.target.closest('.blk').querySelector('[data-act=check]').click(); }
  if(e.key==='Enter'&&e.target.matches('h1[contenteditable],h2[contenteditable],h3[contenteditable]')){ e.preventDefault(); e.target.blur(); }
});

render();
</script>
